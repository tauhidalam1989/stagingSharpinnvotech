name: Deploy Next.js SSR to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Deploy to VPS via SSH
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/nextjs-app || git clone https://github.com/YOUR_USERNAME/YOUR_REPO.git /var/www/nextjs-app
            
            cd /var/www/nextjs-app
            
            git pull origin main
            
            # Install dependencies
            npm install
            
            # Build Next.js app
            npm run build
            
            # Restart app using PM2
            pm2 restart nextjs-app || pm2 start npm --name "nextjs-app" -- start
            
            pm2 save